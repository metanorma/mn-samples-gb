# Verification variant: renders the release-wave candidate stack via the
# repo bundle (the stock sample-docker reusable call is rejected at parse
# time, and the container image does not carry metanorma-gb).
name: docker

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
      # GB needs the SimSun/SimHei formulas, whose archives exceed
      # fontist's default 300 MB formula cap (fontist#569).
      FONTIST_FORMULA_SIZE_LIMIT: "2000"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Print Metanorma version
        run: bundle exec metanorma --version

      - name: Generate the site
        run: |
          bundle exec metanorma site generate --config metanorma.yml \
            --output-dir _site --agree-to-terms
      - name: Upload the site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mn
          path: _site
          retention-days: 14
